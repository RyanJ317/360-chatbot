<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 Heating &amp; Cooling — Chat with Andy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: #1a3a5c;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    .avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #e85d04;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 1.05rem; font-weight: 700; }
    .header-text p  { font-size: 0.78rem; opacity: .8; margin-top: 2px; }
    .online-dot {
      display: inline-block; width: 8px; height: 8px;
      background: #4ade80; border-radius: 50%; margin-right: 5px;
    }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    .msg.andy  { align-self: flex-start; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.andy .bubble {
      background: #fff;
      color: #1a1a1a;
      border-top-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .msg.user .bubble {
      background: #1a3a5c;
      color: #fff;
      border-top-right-radius: 4px;
    }

    /* ── Typing indicator ── */
    .typing-dots {
      display: flex; align-items: center; gap: 4px;
      padding: 12px 16px;
    }
    .typing-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #aaa; display: inline-block;
      animation: bounce .9s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── Input bar ── */
    #input-bar {
      background: #fff;
      border-top: 1px solid #dde3ec;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      border: 1px solid #cdd5e0;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 0.93rem;
      resize: none;
      max-height: 130px;
      outline: none;
      line-height: 1.4;
      font-family: inherit;
      transition: border-color .15s;
    }
    #user-input:focus { border-color: #1a3a5c; }
    #send-btn {
      width: 42px; height: 42px; flex-shrink: 0;
      border: none; border-radius: 50%;
      background: #e85d04; color: #fff;
      cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    #send-btn:hover:not(:disabled)  { background: #c94f03; }
    #send-btn:active:not(:disabled) { transform: scale(.93); }
    #send-btn:disabled { background: #ccc; cursor: default; }

    /* ── Emergency banner ── */
    .emergency-banner {
      background: #fff3cd;
      border-left: 4px solid #e85d04;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: #5c3d00;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="avatar">A</div>
    <div class="header-text">
      <h1>360 Heating &amp; Cooling</h1>
      <p><span class="online-dot"></span>Chat with Andy · 24/7 Emergency: <strong>330-883-2713</strong></p>
    </div>
  </header>

  <div class="emergency-banner">
    &#x1F525; Gas leak or no heat? Call <strong>330-883-2713</strong> immediately — we're available 24/7.
  </div>

  <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

  <div id="input-bar">
    <textarea
      id="user-input"
      rows="1"
      placeholder="Ask Andy about our services…"
      aria-label="Your message"
    ></textarea>
    <button id="send-btn" aria-label="Send message">&#x27A4;</button>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");

  // Stable session ID for this browser tab
  const sessionId = crypto.randomUUID ? crypto.randomUUID()
                  : Math.random().toString(36).slice(2);

  // ── helpers ──────────────────────────────────────────────────────────────

  function addMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg andy";
    wrap.id = "typing-indicator";

    const bubble = document.createElement("div");
    bubble.className = "bubble typing-dots";
    bubble.innerHTML = "<span></span><span></span><span></span>";

    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  // Auto-grow textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + "px";
  });

  // ── send ─────────────────────────────────────────────────────────────────

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      const data = await res.json();
      removeTyping();

      if (data.response) {
        addMessage("andy", data.response);
      } else {
        addMessage("andy", "I'm sorry, something went wrong. Please call us at 330-883-2713.");
      }
    } catch {
      removeTyping();
      addMessage("andy", "I'm having trouble connecting. Please call us directly at 330-883-2713.");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── greeting ─────────────────────────────────────────────────────────────

  window.addEventListener("DOMContentLoaded", () => {
    addMessage("andy",
      "Hi there! I'm Andy from 360 Heating & Cooling. " +
      "How can I help you today? Whether you have questions about our services, " +
      "need a free estimate, or have an emergency — I'm here for you."
    );
    inputEl.focus();
  });
</script>
</body>
</html>
